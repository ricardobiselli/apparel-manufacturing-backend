name: Test VPS SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Validate SSH key
        run: |
          echo "Key file information:"
          wc -c ~/.ssh/deploy_key
          echo "Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Update production code
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/deploy_key \
          ricardo@${{ secrets.DEPLOY_HOST }} \
          "cd ~/apps/apparel-manufacturing-backend && git pull --ff-only origin main && git log -1 --oneline"
