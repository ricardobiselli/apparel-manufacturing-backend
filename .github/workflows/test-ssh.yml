name: Test VPS SSH

on:
  push:
    branches:
      - main

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Validate SSH key
        run: |
          echo "Key file information:"
          wc -c ~/.ssh/deploy_key
          echo "Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/deploy_key \
              ricardo@${{ secrets.DEPLOY_HOST }} \
              "cd ~/apps/apparel-manufacturing-backend && \
              /home/ricardo/.dotnet/dotnet publish ApparelManufacturingApp/ApparelManufacturingApp.csproj -c Release
              sudo systemctl restart apparel-backend.service"
              for i in {1..10}; do
                if curl -f http://127.0.0.1:5000/health; then
                  echo "Health check passed."
                  exit 0
                fi
              
                echo "Health check failed. Waiting for application to start..."
                sleep 2
              done
              
              echo "Health check failed after 20 seconds."
              exit 1
